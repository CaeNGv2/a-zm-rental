<div class="header-header-container">
  <!-- Mobile hamburger button (left side) -->
  <button
    type="button"
    id="header-hamburger-btn"
    class="btn-icon display-none-above-sm js-toggle"
    data-toggle="#header-mobile-nav-overlay"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      width="24"
      height="24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
      />
    </svg>
  </button>

  <!-- logo (centered on mobile, left on desktop) -->
  <a href="index.html" class="header-header-logo">
    <img src="assets/img/logo-on-light.svg" alt="AZoom Rental logo" />
  </a>

  <!-- desktop nav (injected programmatically) -->
  <nav class="header-desktop-nav display-none-sm header-js-nav-container"></nav>

  <!-- desktop book btn -->
  <a href="book.html" class="btn-primary btn-bigger display-none-sm">Book Now</a>

  <!-- user controls part -->
  <div id="header-user-display">
    <button
      id="header-theme-toggle"
      class="btn-icon"
      onclick="window.siteApi.toggleTheme()"
    >
      <span class="header-icon-both">
        <svg
          xmlns="http://w3.org"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <defs>
            <!-- Diagonally cuts the canvas from top-right to bottom-left with a 0.5px gap for the line -->
            <clipPath id="diagonal-top-left">
              <polygon points="-0.5,-0.5 23.5,-0.5 -0.5,23.5" />
            </clipPath>
            <clipPath id="diagonal-bottom-right">
              <polygon points="24.5,0.5 24.5,24.5 0.5,24.5" />
            </clipPath>
          </defs>

          <!-- Top-Left Side: Sun -->
          <g clip-path="url(#diagonal-top-left)">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
            />
          </g>

          <!-- Bottom-Right Side: Moon -->
          <g clip-path="url(#diagonal-bottom-right)">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
            />
          </g>

          <!-- Visible Diagonal Slash Line -->
          <line x1="21" y1="3" x2="3" y2="21" stroke-linecap="round" />
        </svg>
      </span>

      <!-- Sun Icon (Heroicons Outline) -->
      <span class="header-icon-sun">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
          />
        </svg>
      </span>

      <!-- Moon Icon (Heroicons Outline) -->
      <span class="header-icon-moon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
          />
        </svg>
      </span>
    </button>

    <!-- User icon button & dropdown (desktop and mobile) -->
    <div class="dropdown-container">
      <!-- .js-toggle to add programatic toggle based on toggle target -->
      <button
        type="button"
        id="header-user-btn"
        class="btn-icon js-toggle"
        data-toggle="#header-user-dropdown"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          width="24"
          height="24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
          />
        </svg>
      </button>

      <!-- User dropdown card -->
      <div id="header-user-dropdown" class="dropdown-menu">
        <p class="header-user-status" id="header-user-status-text">Please log in.</p>
        <div class="header-user-actions">
          <a href="login.html" id="header-login-btn" class="header-btn-action">Login</a>
          <button type="button" id="header-logout-btn" class="header-btn-action" style="display: none">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile nav overlay -->
  <div class="overlay-menu display-none-above-sm" id="header-mobile-nav-overlay">
    <!-- header-js-nav-container class to prgoramatic inject items -->
    <nav class="header-mobile-nav-list header-js-nav-container"></nav>

    <a href="book.html" class="btn-primary btn-bigger header-mobile-nav-list">Book Now</a>
  </div>
</div>

<style>
  .header-header-container {
    position: relative;
    display: flex;
    height: 70px;
    width: 100%;
    align-items: center;
    column-gap: 20px;
    /* L&R padding */
    padding-inline: 30px;
    /* T&B padding */
    padding-block: 10px;
  }

  a.header-header-logo {
    display: flex;
    align-items: center;
    height: 100%;
  }
  .header-header-logo img {
    display: block;
    /* based on color-scheme (should be set by js) */
    content: light-dark(url("assets/img/logo-on-light.svg"), url("assets/img/logo-on-dark.svg"));
    height: 100%;
    /* allow height to shrink below default 100% but never overflow wifth wise */
    max-width: 100%;
  }

  /* Desktop nav styling */
  .header-desktop-nav {
    display: flex;
    align-items: center;
    column-gap: 5px;
    margin-left: auto;
  }
  .header-desktop-nav a {
    color: inherit;
    text-decoration: none;
    text-align: center;
    padding: 15px 15px;
  }

  /* User controls container */
  #header-user-display {
    display: flex;
    align-items: center;
    column-gap: 12px;
  }

  /* Mobile layout (sm <= 640px): hamburger (left) || logo (center) || user controls (right) */
  @media (width <= 640px) {
    .header-header-container {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      padding-inline: 16px;
      column-gap: 8px;
    }
    a.header-header-logo {
      justify-self: center;
    }
    #header-user-display {
      justify-self: end;
      column-gap: 4px;
    }
  }

  /* Mobile nav overlay content */
  .header-mobile-nav-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .header-mobile-nav-list a {
    color: inherit;
    text-decoration: none;
    padding-block: 4px;
  }

  /* Dropdown actions & status styling */
  .header-user-status {
    font-size: 14px;
    margin-bottom: 4px;
  }
  .header-user-actions .header-btn-action {
    display: inline-block;
    width: 100%;
    text-align: center;
    padding: 6px 12px;
    background-color: var(--color-primary);
    color: var(--color-text-inverse, #fff);
    border: none;
    border-radius: 6px;
    text-decoration: none;
    cursor: pointer;
    font-size: 14px;
  }

  /** Theme toggle changes svg dynamically */
  .header-icon-moon,
  .header-icon-sun,
  .header-icon-both {
    display: none; /* default dont display */
    width: 24px;
    height: 24px;
  }

  html[data-theme-mode="light"] .header-icon-moon {
    display: block;
  }

  html[data-theme-mode="dark"] .header-icon-sun {
    display: block;
  }

  html[data-theme-mode="auto"] .header-icon-both {
    display: block;
  }

  #header-theme-toggle {
    cursor: pointer;
  }
</style>

<script type="module" src="./header.js"></script>

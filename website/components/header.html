<header>
  <h1>Welcome to My Headers</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="#">About</a>
    <a href="#">Gallery</a>
    <a href="#">Contact</a>
    <a href="login.html">Login</a>
  </nav>
  <div id="header-user-display">
    <span>User ID: <strong id="header-user-id">Guest</strong></span>
    <a href="login.html" id="header-login-btn">[Login]</a>
    <button type="button" id="header-logout-btn" style="display: none;">Logout</button>
  </div>
</header>

<script type="module">

function updateHeaderUser() {
  console.log("updateHeaderUser"); // dbg

  const userId = localStorage.getItem("site.session_user_id");
  const userEl = document.getElementById("header-user-id");
  const logoutBtn = document.getElementById("header-logout-btn");
  const loginLink = document.getElementById("header-login-btn");

  if (userEl) {
    if (userId) {
      userEl.textContent = userId;
      if (logoutBtn) {
        logoutBtn.style.display = "inline";
        logoutBtn.onclick = () => {
          localStorage.removeItem("site.session_user_id");
          window.location.reload();
        };
      }
      if (loginLink) {
        loginLink.style.display = "none";
      }
    } else {
      userEl.textContent = "Guest";
      if (logoutBtn) {
        logoutBtn.style.display = "none";
      }
      if (loginLink) {
        loginLink.style.display = "inline";
      }
    }
  }

  // Also sync any optional page-level user-id displays
  document.querySelectorAll(".display-user-id").forEach((el) => {
    el.textContent = userId || "Guest (Not logged in)";
  });
  document.querySelectorAll(".action-logout").forEach((btn) => {
    btn.style.display = userId ? "inline" : "none";
    btn.onclick = () => {
      localStorage.removeItem("site.session_user_id");
      window.location.reload();
    };
  });
}

// Listen when this component loaded
onMounted(updateHeaderUser);
// when auth change
window.addEventListener("authChange", updateHeaderUser)

</script>

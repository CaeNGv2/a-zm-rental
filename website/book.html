<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Fleet - AZoom Car Rental</title>
  <link rel="stylesheet" href="assets/main.css" />
  <script src="assets/main.js" type="module" defer></script>
</head>

<body>
  <!-- Header and Navigation -->
  <header><html-component src="components/header.html"></html-component></header>

  <main>
    <div class="content-center" style="padding-block: 40px;">
      <!-- Page Header -->
      <div style="margin-bottom: 32px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;">
        <div>
          <h1 class="text-display text-size-large" style="margin-bottom: 8px;">Explore Our Fleet</h1>
          <p class="text-standard text-size-normal16" style="color: var(--color-surface-inverse-lower);">
            Choose from our modern, reliable vehicles with upfront pricing and zero hidden fees.
          </p>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="bookings.html" class="btn-less">View My Bookings</a>
        </div>
      </div>

      <!-- Fleet Grid Container -->
      <div id="fleet-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
        <!-- Loading State -->
        <div class="card-box" style="grid-column: 1 / -1; text-align: center; padding: 48px;">
          <p class="text-standard text-size-normal18">Loading vehicle catalog...</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <html-component src="components/footer.html"></html-component>
  </footer>

  <script type="module">
    async function loadFleetCatalog() {
      const grid = document.getElementById("fleet-grid");
      console.dir(window.siteApi)
      try {
        const fleetData = await window.siteApi.getFleet();
        const models = fleetData.models || [];

        if (models.length === 0) {
          grid.innerHTML = `
            <div class="card-box" style="grid-column: 1 / -1; text-align: center; padding: 48px;">
              <p class="text-standard">No vehicles found in fleet catalog.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = models.map((car) => {
          const availBadge = car.isAvail
            ? `<span class="badge badge-success">✓ ${car.availQty} Available</span>`
            : `<span class="badge badge-danger">✕ Fully Booked</span>`;

          const actionBtn = car.isAvail
            ? `<a href="reservation.html?modelId=${encodeURIComponent(car.modelId)}" class="btn-primary" style="flex: 1; padding-block: 10px;">Book Now</a>`
            : `<button type="button" class="btn-raw" style="flex: 1; padding-block: 10px; background-color: var(--color-container); color: var(--color-surface-inverse-lower); cursor: not-allowed;" disabled>Unavailable</button>`;

          return `
            <div class="card-box card-box-hover" style="display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <!-- Car Image Showcase with Fallback Icon -->
                <div style="width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; background-color: var(--color-container); margin-bottom: 16px; display: flex; align-items: center; justify-content: center; position: relative;">
                  <img src="${car.imgPath}" alt="${car.name}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                  <div style="display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; color: var(--color-surface-inverse-lower);">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 48px; height: 48px; color: var(--color-primary);">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.25V4.875A1.125 1.125 0 0 0 13.125 3.75H4.875A1.125 1.125 0 0 0 3.75 4.875V14.25m0 0h16.5" />
                    </svg>
                    <span style="font-size: 13px; font-weight: 500; margin-top: 4px;">${car.name}</span>
                  </div>
                  <div style="position: absolute; top: 12px; right: 12px;">
                    ${availBadge}
                  </div>
                </div>

                <!-- Info Header -->
                <div style="margin-bottom: 12px;">
                  <h3 class="text-display" style="font-size: 20px; font-weight: 600; margin-bottom: 4px;">${car.name}</h3>
                  <p class="text-standard text-size-normal14" style="color: var(--color-surface-inverse-lower);">${car.type}</p>
                </div>

                <!-- Specs Pill Row -->
                <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;">
                  <span class="badge badge-neutral" style="font-weight: 500;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 15px; height: 15px;">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                    </svg>
                    ${car.type.split(" ")[0]} Seater
                  </span>
                  <span class="badge badge-neutral" style="font-weight: 500;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 15px; height: 15px;">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
                    </svg>
                    ${car.gearTypeDesc}
                  </span>
                  <span class="badge badge-neutral" style="font-weight: 500;">
                    Total Units: ${car.totalQty}
                  </span>
                </div>
              </div>

              <!-- Price & Book Button Footer -->
              <div style="border-top: 1px solid var(--color-outline); padding-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                <div>
                  <span style="font-size: 13px; color: var(--color-surface-inverse-lower); display: block;">Daily Rate</span>
                  <span class="text-display font-weight-bold" style="font-size: 22px; color: var(--color-primary);">$${car.dailyRateSGD}</span>
                  <span style="font-size: 13px; color: var(--color-surface-inverse-lower);"> / day</span>
                </div>
                ${actionBtn}
              </div>
            </div>
          `;
        }).join("");
      } catch (err) {
        console.error("Error loading fleet:", err);
        grid.innerHTML = `
          <div class="card-box" style="grid-column: 1 / -1; text-align: center; padding: 48px;">
            <p class="text-standard" style="color: #dc2626;">Failed to load fleet catalog. Please try again.</p>
          </div>
        `;
      }
    }

  
    document.addEventListener("DOMAndLibsLoaded", loadFleetCatalog);
   
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Fleet - AZoom Car Rental</title>
  <link rel="stylesheet" href="assets/main.css" />
  <script src="assets/main.js" type="text/javascript"></script>
</head>

<body>
  <!-- Header and Navigation -->
  <header><html-component src="components/header.html"></html-component></header>

  <main>
    <div class="content-center" style="padding-block: 40px;">
      <!-- Page desc -->
      <div style="margin-bottom: 32px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;">
        <div>
          <h1 class="text-display text-size-large" style="margin-bottom: 8px;">Explore Our Fleet</h1>
          <p class="text-standard text-size-normal16" style="color: var(--color-surface-inverse-lower);">
            Choose from our modern, reliable vehicles with upfront pricing and zero hidden fees.
          </p>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="bookings.html" class="btn-less">View My Bookings</a>
        </div>
      </div>

      <!-- filters bar -->
      <div class="card-box" style="margin-bottom: 32px; padding: 20px;">
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 16px; align-items: flex-end;" class="fleet-filter-grid">
          <!-- Text Search -->
          <div>
            <label for="filter-search" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Search Model</label>
            <input type="text" id="filter-search" placeholder="e.g. Mazda, Civic, Wish..." style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--color-outline); background-color: var(--color-surface-canvas); color: inherit; font-family: inherit;" />
          </div>

          <!-- Vehicle Type Filter -->
          <div>
            <label for="filter-type" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Vehicle Type</label>
            <select id="filter-type" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--color-outline); background-color: var(--color-surface-canvas); color: inherit; font-family: inherit;">
              <option value="all">All Types</option>
              <option value="Sedan">Sedan</option>
              <option value="SUV">SUV</option>
              <option value="MPV">MPV</option>
              <option value="Hatchback">Hatchback</option>
              <option value="Van">Van</option>
            </select>
          </div>

          <!-- Transmission / Gear Filter -->
          <div>
            <label for="filter-gear" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Transmission</label>
            <select id="filter-gear" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--color-outline); background-color: var(--color-surface-canvas); color: inherit; font-family: inherit;">
              <option value="all">All Gears</option>
              <option value="Automatic">Automatic</option>
              <option value="Manual">Manual</option>
            </select>
          </div>

          <!-- Availability Filter -->
          <div>
            <label for="filter-avail" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Availability</label>
            <select id="filter-avail" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--color-outline); background-color: var(--color-surface-canvas); color: inherit; font-family: inherit;">
              <option value="all">All Vehicles</option>
              <option value="available">Available Now</option>
              <option value="unavailable">Fully Booked</option>
            </select>
          </div>

          <!-- Reset Filters Button -->
          <div>
            <button type="button" id="btn-reset-filters" class="btn-less" style="height: 42px; width: 100%; padding-inline: 16px;">
              Reset
            </button>
          </div>
        </div>

        <!-- Filter Results Count Display (Reactive State) -->
        <div style="margin-top: 14px; font-size: 13px; color: var(--color-surface-inverse-lower); display: flex; justify-content: space-between; align-items: center;">
          <span id="filter-count-text">Showing all vehicles</span>
        </div>
      </div>

      <!-- Fleet Grid Container (Components injected reactively) -->
      <div id="fleet-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
        <!-- initial loading state -->
        <div class="card-box" style="grid-column: 1 / -1; text-align: center; padding: 48px;">
          <p class="text-standard text-size-normal18">Loading vehicle catalog...</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <html-component src="components/footer.html"></html-component>
  </footer>

  <style>
    @media (max-width: 900px) {
      .fleet-filter-grid {
        grid-template-columns: 1fr 1fr !important;
      }
    }
    @media (max-width: 600px) {
      .fleet-filter-grid {
        grid-template-columns: 1fr !important;
      }
    }
  </style>

  <script type="module">

    function init() {
      const allModelsState = State.ref([]);
      const filterState = State.ref({
        search: "",
        type: "all",
        gear: "all",
        avail: "all"
      });

      // Reactive computation of filtered models
      const filteredModelsState = State.ref([]);

      State.watchEffect(() => {
        const models = allModelsState.value;
        const filters = filterState.value;

        const filtered = models.filter((car) => {
          // Search query (name or type)
          if (filters.search) {
            const q = filters.search.toLowerCase();
            const matchName = car.name.toLowerCase().includes(q);
            const matchType = car.type.toLowerCase().includes(q);
            if (!matchName && !matchType) return false;
          }

          // Vehicle Type
          if (filters.type !== "all") {
            if (!car.type.toLowerCase().includes(filters.type.toLowerCase())) return false;
          }

          // Gear / Transmission
          if (filters.gear !== "all") {
            if (car.gearTypeDesc.toLowerCase() !== filters.gear.toLowerCase()) return false;
          }

          // Availability
          if (filters.avail === "available" && !car.isAvail) return false;
          if (filters.avail === "unavailable" && car.isAvail) return false;

          return true;
        });

        filteredModelsState.value = filtered;
      });

      // Reactive Render Effect for the Fleet Grid
      State.watch([filteredModelsState, allModelsState], () => {
        const grid = document.getElementById("fleet-grid");
        const countText = document.getElementById("filter-count-text");
        if (!grid) return;

        const items = filteredModelsState.value;
        const total = allModelsState.value.length;

        if (countText) {
          countText.textContent = `Showing ${items.length} of ${total} models`;
        }

        if (total === 0) {
          grid.innerHTML = `
            <div class="card-box" style="grid-column: 1 / -1; text-align: center; padding: 48px;">
              <p class="text-standard" style="color: #dc2626;">Failed to load fleet catalog. Please try again.</p>
            </div>
          `;
          return;
        }

        if (items.length === 0) {
          grid.innerHTML = `
            <div class="card-box" style="grid-column: 1 / -1; text-align: center; padding: 48px;">
              <p class="text-standard text-size-normal16" style="color: var(--color-surface-inverse-lower); margin-bottom: 12px;">
                No vehicles match the selected filter criteria.
              </p>
              <button type="button" class="btn-less" id="btn-clear-match" style="display: inline-block;">Clear Filters</button>
            </div>
          `;
          const clearBtn = document.getElementById("btn-clear-match");
          if (clearBtn) {
            clearBtn.onclick = resetFilters;
          }
          return;
        }

        // Clean declarative component injection
        grid.innerHTML = "";
        items.forEach((car) => {
          const cardComponent = document.createElement("html-component");
          cardComponent.setAttribute("src", "components/fleet-card.html");
          cardComponent.props = {
            modelId: car.modelId,
            name: car.name,
            type: car.type,
            imgPath: car.imgPath,
            gearTypeDesc: car.gearTypeDesc,
            dailyRateSGD: car.dailyRateSGD,
            totalQty: car.totalQty,
            availQty: car.availQty,
            isAvail: car.isAvail,
          };
          grid.appendChild(cardComponent);
        });
      });

      function resetFilters() {
        document.getElementById("filter-search").value = "";
        document.getElementById("filter-type").value = "all";
        document.getElementById("filter-gear").value = "all";
        document.getElementById("filter-avail").value = "all";
        filterState.value = {
          search: "",
          type: "all",
          gear: "all",
          avail: "all"
        };
      }

      async function loadFleetCatalog() {
        try {
          const fleetData = await window.siteApi.getFleet();
          allModelsState.value = fleetData.models || [];
        } catch (err) {
          console.error("Error loading fleet:", err);
        }
      }

      // Bind Filter inputs to reactive State
      function setupFilterListeners() {
        const searchInput = document.getElementById("filter-search");
        const typeSelect = document.getElementById("filter-type");
        const gearSelect = document.getElementById("filter-gear");
        const availSelect = document.getElementById("filter-avail");
        const resetBtn = document.getElementById("btn-reset-filters");

        const syncFilters = () => {
          filterState.value = {
            search: searchInput.value.trim(),
            type: typeSelect.value,
            gear: gearSelect.value,
            avail: availSelect.value
          };
        };

        searchInput.addEventListener("input", syncFilters);
        typeSelect.addEventListener("change", syncFilters);
        gearSelect.addEventListener("change", syncFilters);
        availSelect.addEventListener("change", syncFilters);
        resetBtn.addEventListener("click", resetFilters);
      }
    
      setupFilterListeners();
      loadFleetCatalog();
    }

    if (document.isDOMAndLibsReady) {
      init();
    } else {
      document.addEventListener("DOMAndLibsLoaded", init);
    }
  </script>
</body>

</html>
